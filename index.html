<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>برنسس 👑❤️</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dff6ff, #f3e8ff);
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    color: #333;
}
/* النجوم */
.stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
}
.star {
    position: absolute;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite alternate;
}
@keyframes twinkle {
    from {
        opacity: .2;
        transform: scale(.8);
    }
    to {
        opacity: 1;
        transform: scale(1.3);
    }
}
/* الكرت */
.container {
    width: 90%;
    max-width: 500px;
    text-align: center;
    background: rgba(255,255,255,0.65);
    padding: 35px 25px;
    border-radius: 30px;
    backdrop-filter: blur(12px);
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
}
h1 {
    font-size: 34px;
    margin-bottom: 10px;
}
p {
    font-size: 18px;
    line-height: 1.8;
}
/* دائرة التنفس */
.circle {
    width: 170px;
    height: 170px;
    margin: 30px auto;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
    box-shadow:
        0 0 25px rgba(150,180,255,0.35);
    transition:
        transform 4s ease-in-out,
        box-shadow 4s ease-in-out;
}
.circle.breathe {
    transform: scale(1.35);
    box-shadow:
        0 0 55px rgba(150,180,255,0.7);
}
/* الزر */
button {
    border: none;
    padding: 14px 28px;
    border-radius: 25px;
    font-size: 17px;
    cursor: pointer;
    background: #9b8cff;
    color: white;
    transition: .3s;
}
button:hover {
    transform: scale(1.05);
}
button:active {
    transform: scale(.95);
}
/* الرسالة */
.message {
    margin-top: 25px;
    font-size: 20px;
    font-weight: bold;
    line-height: 1.8;
}
</style>
</head>
<body>
<!-- النجوم -->
<div class="stars">
    <div class="star" style="top:8%; left:12%;"></div>
    <div class="star" style="top:15%; left:80%;"></div>
    <div class="star" style="top:28%; left:25%;"></div>
    <div class="star" style="top:40%; left:90%;"></div>
    <div class="star" style="top:65%; left:12%;"></div>
    <div class="star" style="top:75%; left:85%;"></div>
    <div class="star" style="top:55%; left:70%;"></div>
    <div class="star" style="top:88%; left:35%;"></div>
</div>
<div class="container">
    <h1>برنسس 👑❤️</h1>
    <p>
        قبل ما تبدأي الـ Presentation...
        خدي دقيقة إلك 🌷
    </p>
    <p>
        لا تفكري بالناس ولا بالنتيجة،
        بس ركزي مع نفسك 🤍
    </p>
    <!-- دائرة التنفس -->
    <div class="circle" id="circle">
        خدي نفس 🌿
    </div>
    <button onclick="startBreathing()">
        ابدئي الهدوء ✨
    </button>
    <div class="message" id="message">
        إنتِ قدها ❤️
    </div>
</div>
<script>
let running = false;
function startBreathing() {
    if (running) return;
    running = true;
    const circle = document.getElementById("circle");
    const message = document.getElementById("message");
    let count = 0;
    function breathe() {
        /*
        5 دورات تنفس
        كل دورة:
        4 ثواني شهيق
        4 ثواني زفير
        */
        if (count >= 5) {
            circle.classList.remove("breathe");
            circle.innerHTML = "خلصنا ❤️";
            message.innerHTML =
                "هسا أحسن؟ 🌷<br>" +
                "روحي افرجيهم مين برنسس 😌👑❤️";
            running = false;
            return;
        }
        /* الشهيق */
        circle.classList.add("breathe");
        circle.innerHTML = "خدي نفس 🌿";
        message.innerHTML =
            "شهيق... بهدوء 🤍";
        setTimeout(() => {
            /* الزفير */
            circle.classList.remove("breathe");
            circle.innerHTML = "طلّعيه 🤍";
            message.innerHTML =
                "زفير... ببطء 🌿";
            setTimeout(() => {
                count++;
                breathe();
            }, 4000);
        }, 4000);
    }
    breathe();
}
</script>
</body>
</html>
